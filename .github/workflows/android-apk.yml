name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug > build.log 2>&1 || { code=$?; tail -200 build.log; exit $code; }
      - name: Publish APK or build log to the branch
        if: always()
        shell: bash
        run: |
          mkdir -p release
          [ ! -f android/build.log ] || cp android/build.log release/android-build.log
          [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ] || cp android/app/build/outputs/apk/debug/app-debug.apk release/RubUP-Worker-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/android-build.log release/RubUP-Worker-debug.apk 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Android build outputs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rubup-worker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubup-android-build-log
          path: android/build.log
          if-no-files-found: warn
          retention-days: 14
