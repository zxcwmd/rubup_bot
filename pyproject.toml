[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubup-comment-bot"
version = "1.0.0"
description = "Telegram-controlled assistant for rule-aware TikTok comment workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7,<4",
  "aiosqlite>=0.20,<1",
  "playwright>=1.45,<2",
  "python-dotenv>=1.0,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
rubup-bot = "rubup_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["rubup_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
